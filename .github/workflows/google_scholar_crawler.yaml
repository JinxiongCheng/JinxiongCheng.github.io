name: Get Citation Data

# Google answers the Actions runner IPs with a flat HTTP 403, so this cannot
# run on a schedule here -- it just fails every night. The crawl happens on
# a weekly scheduled task on the local machine instead, from a residential
# connection: see google_scholar_crawler/update-scholar-stats.ps1, which
# publishes to the same branch this workflow would.
#
# Kept dispatchable so it is one click away if the crawl ever moves back to
# CI behind a proxy or the SerpApi Scholar endpoint.
on:
  workflow_dispatch:

# the job pushes the results to the google-scholar-stats branch, and the
# default token is read-only on repositories created since 2023
permissions:
  contents: write

# one crawl at a time: a queue of them only makes Google throttle harder
concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # the crawl takes seconds; anything longer means Google is stalling us,
    # and without this the step sat there until the 6h job limit killed it
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch citation data
        run: |
          cd ./google_scholar_crawler
          pip3 install -r requirements.txt
          python3 main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      # skipped when the fetch fails, which is the point: a throttled run
      # leaves the previously published numbers alone rather than zeroing them
      - name: Publish to the google-scholar-stats branch
        run: |
          cd ./google_scholar_crawler/results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -m "Updated citation data"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:google-scholar-stats
